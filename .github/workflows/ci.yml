# CI: build and test zosasm with both compilers and the sanitizers.
# The whole suite is behind `make test` (unit tests + command line tests);
# the macro-library acceptance run needs a local HLASM library and stays out.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
          - cc: clang
          - cc: gcc
            sanitizers: true
          - cc: clang
            sanitizers: true
    steps:
      - uses: actions/checkout@v4
      - name: build and test
        run: |
          make clean
          if [ -n "${{ matrix.sanitizers }}" ]; then
            # the code is allocate-and-never-free by design for the one shot
            # tools, so leak detection is off; the test binaries and the MCP
            # server are also run by make test
            ASAN_OPTIONS=detect_leaks=0 make CC=${{ matrix.cc }} \
              CFLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g" \
              test
            # MCP server is long-lived; run its tests with leak detection.
            make CC=${{ matrix.cc }} test-mcp-asan
            # library destructors: asm_free()/rep_free() with leak detection.
            make CC=${{ matrix.cc }} test-free-asan
          else
            make CC=${{ matrix.cc }} test
          fi
      - name: CBLOCK runtime (s390x under qemu)
        if: matrix.cc == 'gcc' && !matrix.sanitizers
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-s390x-linux-gnu qemu-user
          sh tests/test_cblock_runtime.sh
      - name: concurrent assemblies
        if: matrix.cc == 'gcc' && !matrix.sanitizers
        run: make CC=${{ matrix.cc }} test-threads
      - name: check generated tables
        # isagen is a developer tool with process-lifetime allocations; when
        # the sanitizer job built it, do not fail on its leaks
        run: ASAN_OPTIONS=detect_leaks=0 make isa-check ebcdic-check
